<ion-app>

    <ion-menu side="start" menuId="navigation" class="navigation-menu" contentId="main-content" type="overlay">
        <ion-header>
            <ion-toolbar>
                @let relations = relationsData$|async;
                @if(relations) {
                    @if(relations && relations.length>1 && (currentRelationsData$|async)) {
                        <ion-item lines="none">
                            <fa-icon class="dark-color" [icon]="['fas', 'book']" slot="start"></fa-icon>
                            <ion-select placeholder="changer" (ionChange)="setCurrentRelation($event)" [value]="(currentRelationsData$|async)?.id">
                                @for(relation of (relationsData$|async); track relation) {
                                <ion-select-option [value]="relation.id"> Code {{relation.name}}</ion-select-option>
                                }
                            </ion-select>
                        </ion-item>
                    }
                    @if(!relations || relations.length==0) {
                        <ion-item lines="none">
                            <fa-icon class="dark-color" [icon]="['fas', 'book']" slot="start"></fa-icon>
                            <ion-label>
                                Aucun code disponible
                            </ion-label>
                        </ion-item>
                    }
                }



            </ion-toolbar>
        </ion-header>
        <ion-content>
            <app-navigation [pages]="appPages"></app-navigation>
        </ion-content>
    </ion-menu>
    <ion-menu side="end" menuId="filters" contentId="main-content" [swipeGesture]="false" type="overlay">
        <ion-header>
            <ion-toolbar color="secondary">
                <ion-title>Filtres</ion-title>
            </ion-toolbar>
        </ion-header>
        <ion-content>
            <app-filtres></app-filtres>
        </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>


</ion-app>
