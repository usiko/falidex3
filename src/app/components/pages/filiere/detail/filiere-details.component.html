@let item = item$|async;
<ion-header>
    <app-header [title]="item ? item.name : 'oops'"></app-header>
</ion-header>

<ion-content>
    @if(item)
    {
        <app-filiere-details-block [filiere$]="item$"></app-filiere-details-block>
    }
    @else
    {
        <app-no-item></app-no-item>
    }
</ion-content>
