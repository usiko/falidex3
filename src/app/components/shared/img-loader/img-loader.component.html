<div class="img-container">
    @if(loading) {
    <div class="loading">
        <ion-spinner color="light"></ion-spinner>
    </div>
    }
    @if(ownSrc) {
        <ion-img [ngStyle]="{'object-fit':objectFit}" [class.img-hidden]="loading" [src]="ownSrc" (ionImgWillLoad)="imgLoading()" (ionImgDidLoad)="imgLoaded()" (ionError)="imgError()"></ion-img>
    }

</div>
