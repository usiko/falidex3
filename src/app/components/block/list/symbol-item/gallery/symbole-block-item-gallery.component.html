@if(item() && navigation()) {
<div class="symbole-gallery-item" [routerLink]="[navigation(),item().id]" (click)="click()">
    <ng-container *ngTemplateOutlet="content"></ng-container>
</div>
}
@if(item() && !navigation()) {
<div class="symbole-gallery-item" (click)="click()">
    <ng-container *ngTemplateOutlet="content"></ng-container>
</div>
}

<ng-template #content>
    <div class="symbole-content">
        <app-img-loader  [src]="imgs()">
        </app-img-loader>
        <div class="title-item">
            <div>
                {{item().name}}
            </div>
        </div>
    </div>
</ng-template>
