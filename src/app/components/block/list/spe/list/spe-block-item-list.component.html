@if(item() && navigation()) {
<ion-item [ngClass]="cssClass()" lines="none" [routerLink]="[navigation(),item().id]" detail>
    <ng-container *ngTemplateOutlet="content"></ng-container>
</ion-item>
}
@if(item() && !navigation()) {
<ion-item [ngClass]="cssClass()" lines="none">
    <ng-container *ngTemplateOutlet="content"></ng-container>
</ion-item>
}
<ng-template #content>


    <ion-label>
        <div>
            <div class="title">
                @if(item().article) {
                <div class="article">{{item().article}}</div>
                }
                @if(item().article) {
                <div>-</div>
                }
                <div class="name">{{item().name}}</div>
            </div>
            <p class="content">
                {{item().text}}
            </p>
        </div>
    </ion-label>

</ng-template>
@if(!item()) {
<ion-item>
    <ion-thumbnail slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
    </ion-thumbnail>
    <ion-label>
        <h3>
            <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </h3>
        <p>
            <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
        </p>
    </ion-label>
</ion-item>
}
