@let spe = spe$|async;
@if(spe)
{
    <ion-card>
        @if(spe.article)
        {
            <ion-card-header>
                <ion-card-title>
                    <div class="title">
                        {{(spe.article)?spe.article:''}} - {{(spe.name)?spe.name:''}}
                    </div>
                </ion-card-title>
            </ion-card-header>
        }
        <ion-card-content [innerHTML]="spe.text" class="content">
        </ion-card-content>
        @if(spe.note)
        {
            <ion-card-content [innerHTML]="spe.note" class="subcontent">
            </ion-card-content>
        }
    </ion-card>
}
